services:
  mongo:
    image: mongo:7
    container_name: yolo-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"  
    volumes:
      - mongo-data:/data/db
    networks:
      - yolo-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend  
    container_name: yolo-backend
    restart: unless-stopped
    environment:
      - MONGO_URI=mongodb://mongo:27017/yolo-db 
    depends_on:
      - mongo
    ports:
      - "5000:5000"  # Backend API port
    networks:
      - yolo-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: yolo-frontend
    restart: unless-stopped
    ports:
      - "3000:80"  # Frontend on http://localhost:3000
    depends_on:
      - backend
    networks:
      - yolo-network

volumes:
  mongo-data:  # Named volume for MongoDB persistence

networks:
  yolo-network:
    driver: bridge 